[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "x-second-brain"
version = "0.3.2"
readme = "README.md"
license = "MIT"
description = "A local-first, evidence-grounded personal knowledge assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1",
  "trafilatura>=2.0,<3", "pydantic>=2.9,<3", "python-dotenv>=1,<2", "numpy>=1.26,<3",
  "cryptography>=46,<48"
]

[project.optional-dependencies]
semantic = ["fastembed>=0.7,<1"]
test = ["pytest>=8,<10"]

[project.scripts]
xsecondbrain = "xsecondbrain.main:run"
xbookmarks = "xsecondbrain.agent_cli:cli"

[tool.setuptools.packages.find]
include = ["xsecondbrain*"]

[tool.setuptools.package-data]
xsecondbrain = ["static/*", "browser_extension/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real network/model tests, explicitly enabled"]
