<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X 书签助手 · 官方 API 接入（可选）</title><link rel="icon" href="/static/mark.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/connect.css?v=0.3.0"><script defer src="/static/official-x.js?v=0.3.0"></script></head>
<body><main><div class="brand"><img src="/static/mark.svg" width="32" height="32" alt=""><span>X 书签助手</span><small>后台脚本</small></div><h1>连接一次，<br>以后只管收藏。</h1><p class="intro">X 长文书签 → 后台 Codex 阅读 → 自动分类入库。<br>需要时，直接在 Codex 里问。</p><div id="connection-state" class="state" role="status">正在连接本地脚本…</div><p id="error" class="error" role="alert" hidden></p>
<form id="local-auth" hidden><label>连接本地知识库<input id="app-token" type="password" placeholder="服务端 APP_TOKEN" autocomplete="off"></label><button>连接后台</button></form>
<section id="setup" hidden><p>首次需要你的 <a href="https://developer.x.com/" target="_blank" rel="noopener">X 开发者应用 ↗</a>。启用 OAuth 2.0，并登记下面的回调地址。X 官方 API 按用量计费。</p><label>回调地址<input id="callback" readonly></label><form id="connect-form"><label>OAuth 2.0 Client ID<input id="client-id" maxlength="250" placeholder="在 X 应用设置中获取" autocomplete="off" required></label><button id="connect-button">连接我的 X 账号 ↗</button></form></section>
<section id="account" hidden><p id="account-name"></p><div id="activation"><label class="check"><input id="cost" type="checkbox">我了解 X API 费用，并已在官方控制台设置支出上限。</label><button id="enable" disabled>开始自动整理</button></div><div id="active" hidden><span class="running-dot"></span><strong>自动整理已开启</strong><p id="schedule"></p><button id="pause" class="secondary">暂停</button></div><button id="disconnect" class="text-button">断开账号</button></section>
<footer><p id="reader-state"></p><p>开启后可以关闭此页面。电脑和后台脚本需保持运行；原文、分类和出处保存在本机知识库。</p><p class="sample">以后对 Codex 说：“从我收藏的长文里，找找解决这个问题的方法。”</p></footer></main></body></html>
